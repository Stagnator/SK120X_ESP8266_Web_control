[env:d1_mini_lite]
platform = espressif8266
board = d1_mini_lite
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
upload_protocol = espota
upload_port = 192.168.1.36
upload_flags =
  --auth=admin

lib_deps = 
	4-20ma/ModbusMaster@^2.0.1
